[build]
  command = "pnpm build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.34.7"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/_network/*"
  to = "/.netlify/functions/gateway?path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/chain-assets/*"
  to = "/.netlify/functions/assets?store=network&path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploaded-assets/*"
  to = "/.netlify/functions/assets?store=image&path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
